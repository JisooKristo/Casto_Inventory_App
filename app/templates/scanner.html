<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Casto Mobile Scanner</title>
  <link rel="stylesheet" href="/static/style.css?v=20260730-serial" />
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="mobile-page">
  <main class="mobile-shell">
    <header class="mobile-head">
      <h1>Remote Barcode Scanner</h1>
      <p class="muted">Session <code id="mobile-session">------</code></p>
      <span id="mobile-status" class="status-pill small">Connecting...</span>
      <p id="scan-formats" class="scan-formats">Listening for QR codes and 1D barcodes: QR, Code 128, Code 39, EAN-13, and UPC-A.</p>
    </header>

    <section class="mobile-card scanner-preview" id="scanner-preview-card">
      <div class="scan-banner" aria-label="Scan steps">
        <div class="scan-step active" id="scan-step-asset">Step 1: Scan Asset QR</div>
        <div class="scan-step" id="scan-step-serial">Step 2: Scan Barcode S/N</div>
      </div>
      <p class="scan-prompt" id="scan-prompt">Scan the asset QR sticker to start the workflow.</p>
      <div class="scan-actions scan-actions-top">
        <button id="skip-serial" class="btn secondary skip-serial hidden" type="button">Skip Serial Number</button>
      </div>
      <div id="reader" class="mobile-reader"></div>
      <div class="scan-actions">
      </div>
      <div id="toast" class="toast hidden"></div>
    </section>

    <section class="mobile-card">
      <h2>Manual Entry</h2>
      <div class="manual-row">
        <input id="manual-input" type="text" placeholder="Type damaged barcode/tag" autocomplete="off" />
        <button id="manual-send" class="btn primary">Send</button>
      </div>
    </section>
  </main>

  <script src="/static/scanner.js?v=20260730-serial"></script>
</body>
</html>
